<!doctype html>
<!--
  Fixture: a focus ring that comes in by a transition, on a page that counts every transition event it hears. The
  focus-visible check takes focus off each stop and gives it back; with transitions on, that would start the ring's
  transition twice more, and the page would hear transitionrun, transitionstart, transitioncancel and transitionend
  of the check's making. Each count must be no higher with the check than without it (test/browser/focus-visible.test.ts):
  the check adds none, while a screenshot's hold can keep back one of the page's own, named while it runs. The ring
  takes 10 s, so no transition ends during a run, and timing cannot change the counts.
  Must fire:     nothing: the ring is seen
  Must not fire: genie/focus-visible; any axe-core rule
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A ring by a transition, heard</title>
    <script>
      const heard = { transitionrun: 0, transitionstart: 0, transitioncancel: 0, transitionend: 0 };
      for (const type of Object.keys(heard)) window.addEventListener(type, () => (heard[type] += 1), true);
      window.report = () => new Promise((done) => setTimeout(() => done(JSON.stringify(heard)), 300));
    </script>
    <style>
      a { outline: 3px solid transparent; outline-offset: 2px; transition: outline-color 10s linear; }
      a:focus { outline-color: #000000; }
    </style>
  </head>
  <body style="background: #ffffff; color: #000000">
    <main>
      <h1>A ring by a transition, heard</h1>
      <p><a id="one" href="#one">One</a></p>
      <p><a id="two" href="#two">Two</a></p>
    </main>
  </body>
</html>

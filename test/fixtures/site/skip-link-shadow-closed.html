<!doctype html>
<!--
  Fixture: the same web-component header, but its six links are in a closed shadow root, which cannot be read.
  The tabbable count sees none of them, so the page is not checked: a known limit (docs/KNOWN-GAPS.md, G8).
  Must fire:     nothing
  Must not fire: genie/skip-link, any axe-core rule
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A header in a closed shadow root</title>
  </head>
  <body style="background: #ffffff; color: #000000">
    <header>
      <site-nav></site-nav>
    </header>
    <main id="main">
      <h1>A header in a closed shadow root</h1>
      <p>The navigation is inside a web component whose shadow root is closed.</p>
    </main>
    <script>
      customElements.define(
        "site-nav",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "closed" }).innerHTML =
              '<nav aria-label="Site"><a href="/one">One</a> <a href="/two">Two</a> <a href="/three">Three</a> ' +
              '<a href="/four">Four</a> <a href="/five">Five</a> <a href="/six">Six</a></nav>';
          }
        },
      );
    </script>
  </body>
</html>

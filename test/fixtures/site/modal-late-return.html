<!doctype html>
<!--
  Fixture: a modal dialog that gives focus back a moment after it closes. "Delete account" (#open) opens a
  role="dialog" with aria-modal="true"; Tab and Shift+Tab go round its two buttons, on purpose, and Escape hides
  it, then puts focus back on "Delete account" in a setTimeout(0), as many dialog libraries do. Focus is read
  after the page has had that moment, so it is seen coming back. The tests scan it open (after a click on #open).
  Must fire:     nothing from genie/keyboard-trap
  Must not fire: genie/focus-not-returned, though focus is on no element the moment Escape returns
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal, focus given back late</title>
    <style>
      [role="dialog"][hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your account</h1>
      <p><a href="#about">About accounts</a></p>
      <p>
        <button type="button" id="open" aria-haspopup="dialog" aria-controls="confirm">Delete account</button>
      </p>
      <p id="about">Deleting an account cannot be undone.</p>
      <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
        <h2 id="confirm-title">Delete your account?</h2>
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="delete">Delete</button>
      </div>
    </main>
    <script>
      const opener = document.getElementById("open");
      const dialog = document.getElementById("confirm");
      const buttons = [...dialog.querySelectorAll("button")];
      let returnTo = null;
      function close() {
        dialog.hidden = true;
        setTimeout(() => {
          if (returnTo) returnTo.focus();
        }, 0);
      }
      opener.addEventListener("click", () => {
        returnTo = document.activeElement;
        dialog.hidden = false;
        buttons[0].focus();
      });
      buttons.forEach((button) => button.addEventListener("click", close));
      dialog.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          close();
          return;
        }
        if (event.key !== "Tab") return;
        const at = buttons.indexOf(document.activeElement);
        const next = event.shiftKey ? (at + buttons.length - 1) % buttons.length : (at + 1) % buttons.length;
        event.preventDefault();
        buttons[next].focus();
      });
    </script>
  </body>
</html>

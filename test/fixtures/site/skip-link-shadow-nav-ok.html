<!doctype html>
<!--
  Fixture: the same web-component header, six links in an open shadow root before the main content, with a skip
  link to #main as the first thing on the page. The skip link is inside the header: axe-core 4.14's region rule
  does not take a link outside every landmark as a skip link when the page's other links are in a shadow root.
  Must fire:     nothing
  Must not fire: genie/skip-link, any axe-core rule
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A header in a shadow root, with a skip link</title>
    <style>
      .skip { position: absolute; left: -9999px; }
      .skip:focus { left: 0; top: 0; background: #ffffff; color: #000000; }
    </style>
  </head>
  <body style="background: #ffffff; color: #000000">
    <header>
      <a class="skip" href="#main">Skip to main content</a>
      <site-nav></site-nav>
    </header>
    <main id="main">
      <h1>A header in a shadow root, with a skip link</h1>
      <p>The first thing a keyboard reaches is the skip link.</p>
    </main>
    <script>
      customElements.define(
        "site-nav",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML =
              '<nav aria-label="Site"><a href="/one">One</a> <a href="/two">Two</a> <a href="/three">Three</a> ' +
              '<a href="/four">Four</a> <a href="/five">Five</a> <a href="/six">Six</a></nav>';
          }
        },
      );
    </script>
  </body>
</html>

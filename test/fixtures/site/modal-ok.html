<!doctype html>
<!--
  Fixture: a modal dialog done right. "Delete account" (#open) opens a role="dialog" with aria-modal="true";
  while it is open, Tab and Shift+Tab go round its two buttons and nothing else, on purpose, and Escape closes
  it and puts focus back on "Delete account". The dialog keeps focus on purpose, so it is not a trap, and
  focus comes back, so focus is not lost. The tests scan it closed, and open (after a click on #open).
  Must fire:     nothing from genie/keyboard-trap or genie/focus-not-returned
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal</title>
    <style>
      [role="dialog"][hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your account</h1>
      <p><a href="#about">About accounts</a></p>
      <p>
        <button type="button" id="open" aria-haspopup="dialog" aria-controls="confirm">Delete account</button>
      </p>
      <p id="about">Deleting an account cannot be undone.</p>
      <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
        <h2 id="confirm-title">Delete your account?</h2>
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="delete">Delete</button>
      </div>
    </main>
    <script>
      const opener = document.getElementById("open");
      const dialog = document.getElementById("confirm");
      const buttons = [...dialog.querySelectorAll("button")];
      let returnTo = null;
      function close() {
        dialog.hidden = true;
        if (returnTo) returnTo.focus();
      }
      opener.addEventListener("click", () => {
        returnTo = document.activeElement;
        dialog.hidden = false;
        buttons[0].focus();
      });
      buttons.forEach((button) => button.addEventListener("click", close));
      dialog.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          close();
          return;
        }
        if (event.key !== "Tab") return;
        const at = buttons.indexOf(document.activeElement);
        const next = event.shiftKey ? (at + buttons.length - 1) % buttons.length : (at + 1) % buttons.length;
        event.preventDefault();
        buttons[next].focus();
      });
    </script>
  </body>
</html>

<!doctype html>
<!--
  Fixture: custom focus styles that replace the browser's outline with something else that can be seen.
  Must fire:     nothing
  Must not fire: genie/focus-visible, as a finding or as needs review; any axe-core rule
  The link's outline becomes a box-shadow ring, the button's a change of background and colour, and the
  field's a thicker, darker border (test/browser/focus-visible.test.ts, claim C8).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom focus styles</title>
    <style>
      a:focus-visible { outline: none; box-shadow: 0 0 0 3px #1a5fb4; border-radius: 2px; }
      button { background: #ffffff; color: #1a5fb4; border: 2px solid #1a5fb4; padding: 4px 12px; }
      button:focus-visible { outline: none; background: #1a5fb4; color: #ffffff; }
      input { border: 1px solid #767676; padding: 4px; }
      input:focus-visible { outline: none; border: 3px solid #000000; padding: 2px; }
    </style>
  </head>
  <body style="background: #ffffff; color: #000000">
    <main>
      <h1>Custom focus styles</h1>
      <p><a id="ring" href="#more">Read more</a></p>
      <p><button id="fill" type="button">Save</button></p>
      <p><label for="name">Name</label> <input id="name" type="text" /></p>
    </main>
  </body>
</html>

<!doctype html>
<!--
  Fixture: an icon-only button with no accessible name.
  Must fire:     button-name (critical)
  Must not fire: any other rule
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icon button fixture</title>
  </head>
  <body>
    <main>
      <h1>Icon button fixture</h1>
      <p>The button below shows only a picture. It has no text, no label and no title.</p>
      <button type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M2 2h12v12H2z" fill="#000000" />
        </svg>
      </button>
    </main>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 730 1600 170">
  <!-- The shelf from the A11y Genie deck: a dark painted board with dust on its top, and its shadow on the wall under it. A still export of the deck's drawing. -->
  <defs>
    <linearGradient id="shelf-shelftop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3d63" />
      <stop offset="100%" stop-color="#2c2342" />
    </linearGradient>
    <linearGradient id="shelf-shelffront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#231b37" />
      <stop offset="100%" stop-color="#120c20" />
    </linearGradient>
    <filter id="shelf-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="n" />
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.77  0 0 0 0 0.84  0 0 0 2.2 -1.3" result="speck" />
      <feComposite in="speck" in2="SourceAlpha" operator="in" />
    </filter>
    <filter id="shelf-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <g>
    <rect x="-40" y="814" width="1680" height="70" fill="#07050f" opacity="0.7" filter="url(#shelf-soft)" />
    <path d="M -40 738 L 1640 738 L 1640 760 L -40 760 Z" fill="url(#shelf-shelftop)" />
    <path d="M -40 738 L 1640 738 L 1640 758 L -40 758 Z" fill="#9d97a8" opacity="0.32" />
    <path d="M -40 738 L 1640 738 L 1640 758 L -40 758 Z" fill="#fff" filter="url(#shelf-grain)" opacity="0.5" />
    <line x1="-40" y1="760" x2="1640" y2="760" stroke="#6c5d8c" stroke-width="2" opacity="0.8" />
    <path d="M -40 760 L 1640 760 L 1640 818 L -40 818 Z" fill="url(#shelf-shelffront)" />
  </g>
</svg>

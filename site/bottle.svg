<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -500 280 540">
  <!-- The genie's bottle from the A11y Genie deck, wiped clean and lit from inside: amber glass, a tall stopper,
       the faded label. A still export of the deck's drawing, no animation. -->
  <defs>
    <linearGradient id="bottle-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a2a06" />
      <stop offset="18%" stop-color="#a3610f" />
      <stop offset="38%" stop-color="#e09a2a" />
      <stop offset="62%" stop-color="#b8721a" />
      <stop offset="86%" stop-color="#6a3c08" />
      <stop offset="100%" stop-color="#8c6a8e" />
    </linearGradient>
    <radialGradient id="bottle-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1c4" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#f2bd45" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f2bd45" stop-opacity="0" />
    </radialGradient>
    <filter id="bottle-soft" x="-50%" y="-50%" width="200%" height="200%">

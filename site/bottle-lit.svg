    </filter>
    <filter id="lit-hair" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>
    <linearGradient id="lit-smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fff1c4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffdf86" stop-opacity="0" />
    </linearGradient>
    <clipPath id="lit-bottleclip">
      <path d="M -72 0 C -104 -2 -120 -44 -117 -98 C -113 -165 -62 -218 -27 -262 L -21 -332 L 21 -332 L 27 -262 C 62 -218 113 -165 117 -98 C 120 -44 104 -2 72 0 Q 0 9 -72 0 Z" />
    </clipPath>
  </defs>
  <ellipse cx="800" cy="560" rx="420" ry="360" fill="url(#lit-spillglow)" />
  <g>
    <ellipse cx="800" cy="752" rx="300" ry="40" fill="url(#lit-spillglow)" opacity="1" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="370 190 860 710">
  <!-- The genie's bottle from the A11y Genie deck, as it stands on the shelf: its lamp-gold light on the wall and on the board, the amber glass, and wish smoke at the lip. A still export of the deck's drawing, no animation. -->
  <defs>
    <linearGradient id="lit-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a2a06" />
      <stop offset="18%" stop-color="#a3610f" />
      <stop offset="38%" stop-color="#e09a2a" />
      <stop offset="62%" stop-color="#b8721a" />
      <stop offset="86%" stop-color="#6a3c08" />
      <stop offset="100%" stop-color="#8c6a8e" />
    </linearGradient>
    <radialGradient id="lit-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1c4" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#f2bd45" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f2bd45" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lit-spillglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdf86" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#f2bd45" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f2bd45" stop-opacity="0" />
    </radialGradient>
    <filter id="lit-soft" x="-50%" y="-50%" width="200%" height="200%">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- The night wall from the A11y Genie deck: night-velvet, a shaft of moonlight from the upper left, and motes of dust in it. A still export of the deck's drawing, no animation. -->
  <defs>
    <radialGradient id="wall-wall" cx="32%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#251a42" />
      <stop offset="55%" stop-color="#120c22" />
      <stop offset="100%" stop-color="#07050f" />
    </radialGradient>
    <linearGradient id="wall-shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9c4f2" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#c9c4f2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c9c4f2" stop-opacity="0" />
    </linearGradient>
    <filter id="wall-wallgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="3" result="n" />
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.55  0 0 0 0 0.8  0 0 0 0.9 -0.42" />
    </filter>
    <filter id="wall-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="wall-softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>
  <g>
    <rect x="0" y="0" width="1600" height="900" fill="url(#wall-wall)" />
    <rect x="0" y="0" width="1600" height="900" filter="url(#wall-wallgrain)" opacity="0.35" />
    <path d="M 120 -40 L 520 -40 L 1180 900 L 560 900 Z" fill="url(#wall-shaft)" filter="url(#wall-soft)" />
    <circle cx="260" cy="140" r="1.2" fill="#c9c4f2" opacity="0.25" />
    <circle cx="397" cy="229" r="1.9" fill="#c9c4f2" opacity="0.38" />
    <circle cx="534" cy="318" r="2.5999999999999996" fill="#c9c4f2" opacity="0.56" />
    <circle cx="671" cy="407" r="3.3" fill="#c9c4f2" opacity="0.69" />
    <circle cx="808" cy="496" r="1.2" fill="#c9c4f2" opacity="0.77" />
    <circle cx="945" cy="585" r="1.9" fill="#c9c4f2" opacity="0.3" />
    <circle cx="1082" cy="204" r="2.5999999999999996" fill="#c9c4f2" opacity="0.36" />
    <circle cx="319" cy="293" r="3.3" fill="#c9c4f2" opacity="0.41" />
    <circle cx="456" cy="382" r="1.2" fill="#c9c4f2" opacity="0.44" />
    <circle cx="593" cy="471" r="1.9" fill="#c9c4f2" opacity="0.28" />
    <circle cx="730" cy="560" r="2.5999999999999996" fill="#c9c4f2" opacity="0.72" />
    <circle cx="867" cy="179" r="3.3" fill="#c9c4f2" opacity="0.84" />
    <circle cx="1004" cy="268" r="1.2" fill="#c9c4f2" opacity="0.88" />
    <circle cx="1141" cy="357" r="1.9" fill="#c9c4f2" opacity="0.9" />

# Lint, typecheck, test and build on every push to main and every pull request.
#
# The job runs only while the repository is public: a private repository here has no free hosted minutes, so
# the guard keeps it from failing until then, and it turns on by itself when the repository is public.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The tests and the deck page's smoke test run on Playwright's headless shell (test/setup/global-chromium.ts),
      # at the playwright-core version package.json pins, with the system libraries it needs on Linux.
      - run: npx playwright-core@1.65.1 install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The deck page (web/, docs/DECK.md): its own install, type check, build and smoke test. The smoke test
      # scans the deck page with the dist/cli.js just built.
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run smoke
        working-directory: web

# Publishes the project's page to GitHub Pages on every push to main that changes it, and on demand: site/ as
# built by scripts/build-site.ts (which adds the deck's button only once DECK_URL is set there), with the deck
# page built from web/ beside it at deck/ (docs/DECK.md).
#
# Two jobs. `build` installs the deck page's npm project from its lockfile, builds both pages and uploads them;
# it holds no token that can publish. `deploy` holds the Pages token and only deploys what `build` uploaded:
# it installs nothing and runs no code from the repository.
#
# Like CI, the jobs run only while the repository is public. Pages' source is "GitHub Actions" (Settings,
# Pages, Build and deployment). The project's page and the deck page are scanned by tests
# (test/browser/site.test.ts, and `npm run smoke` in web/), so CI checks them on every push and pull request.
#
# Making the repository public does not publish the page: nothing has pushed to site/ or web/. The first time,
# set the source above once the repository is public, then run this workflow by hand (Actions, Pages, Run
# workflow).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-site.ts", "web/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: what this job uploads is published, so it installs from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The deck page: its own npm project, built with relative addresses so it works at deck/.
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # One folder for Pages: the project's page, and the deck page beside it. The build of the project's page
      # needs Node only. web/tests/smoke.mjs runs this same step.
      - name: Assemble the page
        run: |
          node scripts/build-site.ts _site
          cp -R web/dist _site/deck
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
